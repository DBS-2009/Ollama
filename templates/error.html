<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body { background: #0a0e27; color: #f0f9ff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(31, 40, 71, 0.95); padding: 32px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); max-width: 600px; width: 100%; }
        h1 { margin-top: 0; color: #ff6b6b; }
        p { color: #cbd5e1; font-size: 1rem; line-height: 1.6; }
        a { color: #7c3aed; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Oops.</h1>
        <p>{{ error }}</p>
        <p><a href="/">Return to home</a></p>
    </div>
</body>
</html>
